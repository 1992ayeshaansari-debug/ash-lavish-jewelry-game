<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ash Lavish Jewels - Jewelry Match</title>

    <link rel="stylesheet" href="game.css">
</head>

<body>

<div class="game-container">

    <h1>💎 Jewelry Match 💎</h1>

    <p class="subtitle">
        Match 3 beautiful jewels!
    </p>


    <div class="game-info">

        <div>
            <span>Score</span>
            <strong id="score">0</strong>
        </div>

        <div>
            <span>Moves</span>
            <strong id="moves">30</strong>
        </div>

        <div>
            <span>Best</span>
            <strong id="highScore">0</strong>
        </div>

        <div>
            <span>Level</span>
            <strong id="level">1</strong>
        </div>

        <div>
            <span>Lives</span>
            <strong id="lives">❤️❤️❤️</strong>
        </div>

    </div>

<div class="sound-controls">

    <button id="musicBtn" class="sound-btn">
        🎵 Music ON
    </button>

    <button id="soundBtn" class="sound-btn">
        🔊 Sound ON
    </button>

</div>

    <div
        id="gameBoard"
        class="game-board"
    ></div>


    <button
        id="restartBtn"
        class="restart-btn"
    >
        🔄 Restart Game
    </button>


    <button
        id="backBtn"
        class="back-btn"
    >
        💎 Ash Lavish Jewels
    </button>

</div>


<!-- GAME MESSAGE -->

<div
    id="gameMessage"
    class="game-message hidden"
>

    <div class="message-box">

        <div
            id="messageTitle"
            class="message-title"
        ></div>

        <div
            id="messageText"
            class="message-text"
        ></div>

        <button
            id="playAgainBtn"
            class="play-again-btn"
        >
            🔄 Play Again
        </button>

    </div>

</div>

<div id="gameMessage" class="game-message hidden">

    <div class="message-box">

        <div id="messageTitle" class="message-title">
            💎 GAME OVER 💎
        </div>

        <div id="messageText" class="message-text">
            Your Score: 0
        </div>

        <button
            id="playAgainBtn"
            class="play-again-btn"
        >
            🔄 Play Again
        </button>

    </div>
</div>
<script src="game.js"></script>

</body>
            </html>
