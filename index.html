<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ash Lavish Jewels - Jewelry Match</title>

    <link rel="stylesheet" href="game.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
</head>

<body>

    <div class="game-container">

        <h1>💎 Jewelry Match 💎</h1>

        <p class="subtitle">Match 3 beautiful jewels!</p>

        <div class="game-info">
            <div>
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>Moves</span>
                <strong id="moves">30</strong>
            </div>
            
            <div>
    <span>Best</span>
    <strong id="highScore">0</strong>
</div>

<div>
    <span>Level</span>
    <strong id="level">1</strong>
</div>

<div>
    <span>Time</span>
    <strong id="timer">60</strong>
</div>

<div>
    <span>Lives</span>
    <strong id="lives">❤️❤️❤️</strong>
</div>
        </div>

        <div id="gameBoard" class="game-board"></div>

        <button id="restartBtn" class="restart-btn">
            🔄 Restart Game
        </button>

        <button id="backBtn" class="back-btn">
            💎 Ash Lavish Jewels
        </button>

    </div>

    <script src="game.js"></script>

</body>
                  </html>
